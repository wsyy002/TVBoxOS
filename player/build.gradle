plugins {
    id 'com.android.library'
}

android {
    namespace 'xyz.doikki.videoplayer'
    compileSdk 34

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 28
    }

    buildTypes {
        all {
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        releaseSimon.initWith(release)
        releaseSimon {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.8.2"

    // Media3 (ExoPlayer) — 新版，直接使用，不经过 DKPlayer 封装
    api "androidx.media3:media3-exoplayer:1.9.2"
    api "androidx.media3:media3-exoplayer-dash:1.9.2"
    api "androidx.media3:media3-exoplayer-hls:1.9.2"
    api "androidx.media3:media3-exoplayer-rtsp:1.9.2"
    api "androidx.media3:media3-datasource-rtmp:1.9.2"
    api "androidx.media3:media3-ui:1.9.2"
    api "androidx.media3:media3-common:1.9.2"
    api "androidx.media3:media3-datasource:1.9.2"
    api "androidx.media3:media3-extractor:1.9.2"

    // DKPlayer — 只保留 UI 抽象层和 IJK 播放器
    api 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'
}